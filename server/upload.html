<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropEasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <main>
    <div class="flex flex-col items-center px-6 py-5">
      <h1 class="font-bold text-xl">DropEasy</h1>
      <p class="text-sm text-gray-600">Invia file al PC.</p>

      <input type="file" id="f" multiple class="mt-4 text-sm text-gray-600">
      <button id="b" type="button"
        class="bg-amber-600 text-white font-semibold px-2 py-1 rounded-md shadow transition mt-3 cursor-pointer hover:bg-amber-700 active:bg-amber-800">
        Invia
      </button>

      <h2 class="text-lg font-semibold mb-2 mt-4">Invio</h2>
      <div class="w-full max-w-lg">
        <p id="empty" class="text-gray-500 text-center py-4 border rounded">Nessun file ancora.</p>
        <table id="table" class="hidden w-full border rounded shadow mt-2 bg-white">
          <thead>
            <tr class="bg-amber-50">
              <th class="py-2 px-3 text-left font-medium border-b">Nome file</th>
              <th class="py-2 px-3 text-left font-medium border-b">Stato</th>
            </tr>
          </thead>
          <tbody id="out"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    const T = new URLSearchParams(location.search).get("t");
    const out = document.getElementById("out");

    function esc(value) {
      return value.replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function send(file) {
      return new Promise((res) => {
        document.getElementById("empty").classList.add("hidden");
        document.getElementById("table").classList.remove("hidden");

        const row = document.createElement("tr");
        row.className = "hover:bg-amber-100 transition";
        row.innerHTML = `
          <td class="py-2 px-3 border-b">${esc(file.name)}</td>
          <td class="py-2 px-3 border-b flex items-center">
            <progress max="100" value="0" class="w-full h-2 align-middle [&::-webkit-progress-bar]:bg-amber-100 [&::-webkit-progress-value]:bg-amber-600 [&::-moz-progress-bar]:bg-amber-600"></progress>
            <span class="status ml-2 text-sm"></span>
          </td>
        `;
        out.appendChild(row);

        const bar = row.querySelector("progress");
        const st = row.querySelector(".status");
        const fd = new FormData();
        fd.append("file", file);
        const x = new XMLHttpRequest();
        x.open("POST", "/upload?t=" + encodeURIComponent(T));
        x.upload.onprogress = (e) => {
          if (e.lengthComputable) bar.value = e.loaded / e.total * 100;
        };
        x.onload = () => {
          st.textContent = x.status === 200 ? "✔" : "✘ " + x.status;
          st.className = x.status === 200
            ? "status ml-2 text-sm text-green-600 font-bold"
            : "status ml-2 text-sm text-red-600 font-bold";
          res();
        };
        x.onerror = () => {
          st.textContent = "✘ errore di rete";
          st.className = "status ml-2 text-sm text-red-600 font-bold";
          res();
        };
        x.send(fd);
      });
    }

    document.getElementById("b").onclick = async () => {
      const files = document.getElementById("f").files;
      for (const f of files) await send(f);
    };
  </script>
</body>

</html>
